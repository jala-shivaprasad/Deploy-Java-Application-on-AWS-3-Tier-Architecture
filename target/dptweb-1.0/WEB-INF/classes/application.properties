spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=.jsp

# ---------------------------------------------------------------------------
# Database connection (Amazon RDS MySQL - "UserDB" / "Employee" table)
#
# SECURITY NOTE: this file previously had the RDS username/password hardcoded
# in plain text and committed alongside the source code. The values below now
# come from environment variables (DB_URL / DB_USERNAME / DB_PASSWORD), with
# the current values kept only as a *fallback* default so this still runs
# out-of-the-box on the existing EC2/Tomcat deployment without extra setup.
#
# For production, set these as real environment variables instead (EC2
# instance environment / systemd unit / Elastic Beanstalk config, or better,
# resolve them from AWS Secrets Manager or SSM Parameter Store) and rotate
# the RDS password, since it has been sitting in this file in plain text.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://database-1.ckzguuqied9b.us-east-1.rds.amazonaws.com:3306/UserDB}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:Shiva939013}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool sizing (HikariCP, via spring-boot-starter-jdbc) - safe
# defaults for a small EC2 instance sitting behind an ALB.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
# Don't hard-fail application/context startup if RDS isn't reachable yet
# (e.g. EC2 boots before the DB is ready, or `mvn test` runs somewhere
# without VPC access to RDS) - the pool will keep retrying lazily instead.
spring.datasource.hikari.initialization-fail-timeout=-1

# Session cookie hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

# Don't leak stack traces to the browser (GlobalExceptionHandler renders error.jsp instead)
server.error.include-message=never
server.error.include-stacktrace=never
